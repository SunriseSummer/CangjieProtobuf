[dependencies]

[workspace] # 工作空间管理字段，与 package 字段不能同时存在
  members = ["src/protobuf","src/google","src/protoc"] # 工作空间成员模块列表，必需
  build-members = ["src/protoc"] # 工作空间编译模块列表，需要是成员模块列表的子集，非必需
  test-members = ["src/protoc"] # 工作空间测试模块列表，需要是编译模块列表的子集，非必需
  compile-option = "" # 应用于所有工作空间成员模块的额外编译命令选项，非必需
  override-compile-option = "-O2 --int-overflow=wrapping" # 应用于所有工作空间成员模块的额外全局编译命令选项，非必需
  link-option = "" # 应用于所有工作空间成员模块的链接器透传选项，非必需
  target-dir = "" # 指定产物存放路径，非必需
